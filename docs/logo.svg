<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <title>lazyguitarist</title>
  <rect width="1080" height="1080" rx="90" fill="#ffffff"/>
  <g font-family="Nunito, 'Varela Round', 'Adwaita Sans', sans-serif" fill="#b4b4b4" font-size="44">
    <text x="90" y="120">"sounds pretty good"</text>
    <text x="90" y="850">"one more solo"</text>
  </g>
  <!-- floating note -->
  <g fill="#99ccff">
    <ellipse cx="900" cy="185" rx="44" ry="34" transform="rotate(-20 900 185)"/>
    <rect x="932" y="30" width="18" height="160" rx="9"/>
    <path d="M941 30 c40 10 70 40 66 95 c-12 -30 -36 -48 -66 -50 z"/>
  </g>
  <!-- amp used as a pillow -->
  <g>
    <rect x="690" y="610" width="330" height="250" rx="40" fill="#333"/>
    <rect x="725" y="690" width="260" height="140" rx="20" fill="#555"/>
    <circle cx="900" cy="650" r="20" fill="#33ffff"/>
    <circle cx="950" cy="650" r="20" fill="#2bd47f"/>
  </g>
  <!-- the lazy guitar, leaning back -->
  <g transform="translate(650 590) rotate(18) scale(0.85)">
    <!-- neck and headstock -->
    <rect x="-400" y="-24" width="270" height="48" rx="20" fill="#333"/>
    <path d="M-400 -36 L-570 -70 C-610 -76 -630 -50 -620 -20 L-600 40 C-592 58 -570 62 -550 52 L-400 30 Z" fill="#333"/>
    <!-- tuning pegs -->
    <circle cx="-600" cy="-115" r="52" fill="#333"/>
    <circle cx="-600" cy="-115" r="34" fill="#ff66ff"/>
    <circle cx="-500" cy="-100" r="46" fill="#333"/>
    <circle cx="-500" cy="-100" r="30" fill="#ffff00"/>
    <circle cx="-405" cy="-85" r="46" fill="#333"/>
    <circle cx="-405" cy="-85" r="30" fill="#33ffff"/>
    <!-- body -->
    <path d="M220 0 C220 -120 130 -160 50 -150 C-10 -143 -30 -108 -80 -108 C-125 -108 -150 -170 -205 -160 C-245 -150 -225 -100 -198 -62 C-176 -30 -176 30 -198 62 C-225 100 -240 145 -198 152 C-145 158 -115 108 -70 108 C-25 108 -15 150 50 150 C130 160 220 120 220 0 Z" fill="#333"/>
    <!-- strings -->
    <g stroke="#777" stroke-width="4">
      <line x1="-530" y1="-12" x2="150" y2="-12"/>
      <line x1="-530" y1="0" x2="150" y2="0"/>
      <line x1="-530" y1="12" x2="150" y2="12"/>
    </g>
    <rect x="140" y="-40" width="22" height="80" rx="8" fill="#555"/>
    <!-- sleepy face -->
    <g stroke="#fff" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M-40 -100 q22 18 44 0"/>
      <path d="M50 -100 q22 18 44 0"/>
    </g>
    <ellipse cx="28" cy="-55" rx="13" ry="16" fill="#fff"/>
  </g>
  <!-- zzz -->
  <g font-family="Nunito, 'Varela Round', 'Adwaita Sans', sans-serif" font-weight="800" fill="#2bd47f">
    <text x="720" y="420" font-size="54">z</text>
    <text x="765" y="365" font-size="70">z</text>
    <text x="820" y="295" font-size="90">Z</text>
  </g>
  <text x="540" y="1020" text-anchor="middle" font-family="Nunito, 'Varela Round', 'Adwaita Sans', sans-serif" font-weight="800" font-size="150" fill="#333" letter-spacing="-4">lazyguitarist</text>
</svg>
